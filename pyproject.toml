[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (formatter handles this)
]

[tool.ruff.lint.isort]
known-first-party = ["config", "db", "jobs", "mappings", "scrapers", "utils"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = false

[[tool.mypy.overrides]]
module = ["scrapers.an_scraper", "scrapers.as_scraper"]
disable_error_code = ["union-attr", "arg-type", "assignment", "call-overload", "operator"]
