{% extends "base.html" %}
{% block title %}Search - Antara{% endblock %}
{% block content %}
<div class="search-container">
  <h2>Find profile on the other site</h2>
  <p class="hint">Enter an AN ID (e.g. AGM000000) or an AS ID (e.g. SB000/00)</p>

  <div class="search-box">
    <input type="text" id="profile-id-input" placeholder="Enter profile ID" autocomplete="off">
    <button id="load-profile-btn" class="btn-secondary">Load Profile</button>
    <button id="search-btn" class="btn-primary">Search</button>
    <button id="cancel-btn" class="btn-cancel" style="display:none">Cancel</button>
  </div>

  <div id="status-area"></div>
  <div id="results-area"></div>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}
